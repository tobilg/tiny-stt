name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Use fresh dependencies for release builds
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # Reads the exact version from packageManager.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ !inputs.release && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:release
      - run: pnpm typecheck
      - run: pnpm test
      - name: Pack and verify both public packages
        run: pnpm release:check
      - name: Upload the exact npm artifacts to test and publish
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: |
            artifacts/tiny-stt-*.tgz
            artifacts/release.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare self-hosted demo assets
        run: pnpm --filter @tiny-stt/demo run assets:prepare
      - name: Build demo for the root of its Pages project
        run: pnpm --filter @tiny-stt/demo run build:pages
      - run: pnpm --filter @tiny-stt/demo exec playwright install --with-deps chromium
      - name: Test the deployable demo with real speech and external hosts blocked
        run: pnpm --filter @tiny-stt/demo run test:pages
      - uses: actions/upload-artifact@v7
        with:
          name: demo
          path: packages/demo/dist-pages
          if-no-files-found: error
          retention-days: 7

  node:
    needs: check
    name: node (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ !inputs.release && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm assets:prepare
      - run: pnpm test:integration
      - run: pnpm test:abi
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: packages/whistle
      - run: pnpm test:packed-node
      - name: Test the same tarball with OS networking disabled
        if: runner.os == 'Linux'
        run: docker run --rm --network none -v "$PWD/packages:/input:ro" node:${{ matrix.node }}-bookworm-slim node /input/whistle/tests/packed-node.mjs /input/whistle

  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ !inputs.release && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tiny-stt/whistle exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm build
      - run: pnpm assets:prepare
      - run: pnpm test:browser
        env:
          BROWSER: ${{ matrix.browser }}
      - run: pnpm demo:prepare
      - run: pnpm test:demo
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: packages/demo/.cache/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  consumer:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ !inputs.release && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tiny-stt/whistle exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm assets:prepare
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: packages/whistle
      - name: Test both downloaded artifacts without repacking
        run: pnpm test:consumer:packed

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ !inputs.release && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tiny-stt/documentation exec playwright install --with-deps chromium
      - run: pnpm test:docs
      - name: Check the documentation at its Pages root
        run: pnpm --filter @tiny-stt/documentation run test:pages
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: packages/documentation/dist
          if-no-files-found: error
          retention-days: 7
